<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
    }
    .product-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .product-price {
      color: #2ab640;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .buy-btn {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <h1>🛍️ Catalogue</h1>
  <div id="catalog">Chargement des produits...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    fetch('/api/products')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('catalog');
        container.innerHTML = '';

        if (!data.categories || data.categories.length === 0) {
          container.innerHTML = '<p style="text-align:center;">Aucun produit disponible.</p>';
          return;
        }

        data.categories.forEach(cat => {
          cat.products.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
              <div class="product-title">${prod.title}</div>
              <div class="product-price">${prod.price}</div>
              <button class="buy-btn" onclick="order('${prod.title}')">Commander</button>
            `;
            container.appendChild(card);
          });
        });
      });

    function order(item) {
      tg.sendData(`Commande : ${item}`);
      tg.close();
    }
  </script>
</body>
</html>
