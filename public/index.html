<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .back-btn {
      background: none;
      border: none;
      color: #2481cc;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      display: none;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 14px;
      background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    .product-card {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
    }
    .product-img {
      max-width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .product-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .product-price {
      color: #2ab640;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .buy-btn {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <button id="back-btn" class="back-btn" onclick="showCategories()">⬅️ Retour aux catégories</button>
  <h1 id="title">📁 Catégories</h1>
  <div id="content" class="grid">Chargement...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let storeData = { categories: [] };

    fetch('/api/products')
      .then(res => res.json())
      .then(data => {
        storeData = data;
        showCategories();
      });

    function showCategories() {
      document.getElementById('title').innerText = "📁 Catégories";
      document.getElementById('back-btn').style.display = 'none';
      const container = document.getElementById('content');
      container.innerHTML = '';

      if (!storeData.categories || storeData.categories.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Aucune catégorie disponible.</p>';
        return;
      }

      storeData.categories.forEach((cat, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = cat.name;
        div.onclick = () => showProducts(index);
        container.appendChild(div);
      });
    }

    function showProducts(catIndex) {
      const category = storeData.categories[catIndex];
      document.getElementById('title').innerText = category.name;
      document.getElementById('back-btn').style.display = 'block';
      const container = document.getElementById('content');
      container.innerHTML = '';

      if (!category.products || category.products.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Aucun produit dans cette catégorie.</p>';
        return;
      }

      category.products.forEach(prod => {
        const div = document.createElement('div');
        div.className = 'product-card';
        
        let imgHtml = prod.image ? `<img src="${prod.image}" class="product-img" alt="${prod.title}">` : '';

        div.innerHTML = `
          ${imgHtml}
          <div class="product-title">${prod.title}</div>
          <div class="product-price">${prod.price}</div>
          <button class="buy-btn" onclick="order('${prod.title}')">Commander</button>
        `;
        container.appendChild(div);
      });
    }

    function order(item) {
      tg.sendData(`Commande : ${item}`);
      tg.close();
    }
  </script>
</body>
</html>
