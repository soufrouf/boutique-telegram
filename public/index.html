<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
    }
    .header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      text-align: center;
    }
    .store-logo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .store-desc {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
      line-height: 1.4;
      max-width: 90%;
    }
    h1 { font-size: 20px; text-align: center; margin: 8px 0 16px 0; }
    .nav-btn {
      background: none; border: none; color: #2481cc;
      font-weight: bold; cursor: pointer; margin-bottom: 12px; display: none;
    }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .cat-card {
      border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px;
      background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
      cursor: pointer; display: flex; align-items: center; gap: 12px;
    }
    .cat-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
    .cat-title { font-weight: bold; font-size: 16px; }
    .product-card {
      border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; align-items: center;
      background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
    }
    .product-img { max-width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .product-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
    .product-desc { font-size: 13px; opacity: 0.8; text-align: center; margin-bottom: 8px; }
    .product-price { color: #2ab640; font-weight: bold; margin-bottom: 8px; }
    .action-btn {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; padding: 10px 16px; border-radius: 8px;
      font-weight: bold; cursor: pointer; width: 100%; text-decoration: none;
      text-align: center; box-sizing: border-box; margin-bottom: 8px; display: block;
    }
    .support-btn { background-color: #34a853; }
    .info-box {
      background: #f0f4f8; border: 1px solid #d0d7de; border-radius: 8px;
      padding: 10px; margin-bottom: 10px; font-size: 13px; word-break: break-all;
    }
  </style>
</head>
<body>

  <button id="nav-btn" class="nav-btn" onclick="showCategories()">⬅️ Retour aux catégories</button>

  <div id="store-header" class="header-container"></div>

  <h1 id="title">📁 Catégories</h1>
  <div id="content" class="grid">Chargement...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let storeData = { categories: [], storeInfo: {}, settings: {} };
    let currentCategoryIndex = null;

    fetch('/api/products')
      .then(res => res.json())
      .then(data => {
        storeData = data;
        renderHeader();
        showCategories();
      });

    function renderHeader() {
      const header = document.getElementById('store-header');
      header.innerHTML = '';

      const info = storeData.storeInfo;
      if (!info) return;

      if (info.logoActive && info.logoUrl) {
        header.innerHTML += `<img src="${info.logoUrl}" class="store-logo" alt="Logo">`;
      }
      if (info.description) {
        header.innerHTML += `<div class="store-desc">${info.description}</div>`;
      }
    }

    function showCategories() {
      document.getElementById('title').innerText = "📁 Catégories";
      document.getElementById('nav-btn').style.display = 'none';
      document.getElementById('store-header').style.display = 'flex';
      
      const container = document.getElementById('content');
      container.innerHTML = '';

      if (!storeData.categories || storeData.categories.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Aucune catégorie disponible.</p>';
        return;
      }

      storeData.categories.forEach((cat, index) => {
        const div = document.createElement('div');
        div.className = 'cat-card';
        let imgHtml = cat.image ? `<img src="${cat.image}" class="cat-img">` : '';
        div.innerHTML = `${imgHtml}<div class="cat-title">${cat.name}</div>`;
        div.onclick = () => showProducts(index);
        container.appendChild(div);
      });
    }

    function showProducts(catIndex) {
      currentCategoryIndex = catIndex;
      document.getElementById('store-header').style.display = 'none';

      const category = storeData.categories[catIndex];
      document.getElementById('title').innerText = category.name;
      const navBtn = document.getElementById('nav-btn');
      navBtn.innerText = "⬅️ Retour aux catégories";
      navBtn.onclick = showCategories;
      navBtn.style.display = 'block';

      const container = document.getElementById('content');
      container.innerHTML = '';

      if (!category.products || category.products.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Aucun produit dans cette catégorie.</p>';
        return;
      }

      category.products.forEach(prod => {
        const div = document.createElement('div');
        div.className = 'product-card';
        let imgHtml = prod.image ? `<img src="${prod.image}" class="product-img">` : '';
        let descHtml = prod.description ? `<div class="product-desc">${prod.description}</div>` : '';

        div.innerHTML = `
          ${imgHtml}
          <div class="product-title">${prod.title}</div>
          ${descHtml}
          <div class="product-price">${prod.price}</div>
          <button class="action-btn" onclick="checkout('${prod.title}', '${prod.price}')">Commander</button>
        `;
        container.appendChild(div);
      });
    }

    function checkout(title, price) {
      document.getElementById('store-header').style.display = 'none';
      document.getElementById('title').innerText = "💳 Règlement";
      
      const navBtn = document.getElementById('nav-btn');
      navBtn.innerText = "⬅️ Retour aux produits";
      navBtn.onclick = () => showProducts(currentCategoryIndex);

      const container = document.getElementById('content');
      container.innerHTML = `<p style="text-align:center;"><b>${title}</b> — ${price}</p>`;

      const s = storeData.settings;
      if (!s) return;

      if (s.cb && s.cb.active) {
        container.innerHTML += `<a href="${s.cb.url}" target="_blank" class="action-btn">💳 Payer par Carte Bancaire</a>`;
      }
      if (s.paypal && s.paypal.active) {
        container.innerHTML += `<a href="${s.paypal.url}" target="_blank" class="action-btn">🅿️ Payer via PayPal</a>`;
      }
      if (s.crypto && s.crypto.active) {
        container.innerHTML += `<div class="info-box"><b>Adresse Crypto :</b><br>${s.crypto.address}</div>`;
      }
      if (s.virement && s.virement.active) {
        container.innerHTML += `<div class="info-box"><b>RIB / IBAN :</b><br>${s.virement.iban}</div>`;
      }
      if (s.support && s.support.active) {
        container.innerHTML += `<a href="https://t.me/${s.support.username}" target="_blank" class="action-btn support-btn">💬 Contacter le vendeur</a>`;
      }
    }
  </script>
</body>
</html>
